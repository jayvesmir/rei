name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
        arch: [x64, arm64]
        compiler: [gcc, clang]
        exclude:
          # gcc on macOS is just Apple Clang
          - os: macos
            compiler: gcc
          - os: macos
            arch: x64
        include:
          - { os: linux, arch: x64, runner: ubuntu-26.04 }
          - { os: linux, arch: arm64, runner: ubuntu-26.04-arm }
          - { os: macos, arch: arm64, runner: macos-26 }
          - { os: windows, arch: x64, compiler: msvc, runner: windows-2025 }

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v7

      # The Ubuntu images only ship up to GCC 15 and Clang 22. Local act runs use the host's compilers instead.
      - name: Install GCC 16
        if: ${{ matrix.os == 'linux' && matrix.compiler == 'gcc' && !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-16
          gcc-16 --version
          sudo ln -sf /usr/bin/gcc-16 /usr/local/bin/gcc

      - name: Install Clang 23
        if: ${{ matrix.os == 'linux' && matrix.compiler == 'clang' && !env.ACT }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y "deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main"
          sudo apt-get install -y clang-23
          sudo ln -sf /usr/bin/clang-23 /usr/local/bin/clang

      - name: Install Vulkan
        if: ${{ matrix.os == 'linux' && !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "VULKAN_TEST_FLAGS=--test_env=REI_GPU_VK_REQUIRE_DRIVER=1" >> "$GITHUB_ENV"

      - name: Install Vulkan
        if: ${{ matrix.os == 'macos' }}
        run: |
          brew install mesa vulkan-loader vulkan-validationlayers
          driver="$(brew --prefix mesa)/share/vulkan/icd.d/lvp_icd.aarch64.json"
          layer="$(brew --prefix vulkan-validationlayers)"
          layers="$(brew --prefix)/etc/vulkan/explicit_layer.d"

          # dyld doesn't search Homebrew's prefix, and /usr/local/lib is the one absolute path volk tries.
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" /usr/local/lib/libvulkan.dylib

          # The layer's manifest names its library without a directory, which the loader can't open either.
          mkdir -p "$layers"
          sed "s|\"library_path\": \"|&$layer/lib/|" "$layer/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" \
            > "$layers/VkLayer_khronos_validation.json"
          test -f "$driver"
          grep -q "$layer/lib/libVkLayer_khronos_validation.dylib" "$layers/VkLayer_khronos_validation.json"

          echo "VULKAN_TEST_FLAGS=--test_env=REI_GPU_VK_REQUIRE_DRIVER=1 --test_env=VK_DRIVER_FILES=$driver --test_env=VK_LAYER_PATH=$layers" >> "$GITHUB_ENV"

      # The runner is elevated, so the loader ignores its environment variables and only reads the registry.
      # The SDK installer replaces the image's Vulkan 1.3 loader and registers the validation layer.
      - name: Install Vulkan
        if: ${{ matrix.os == 'windows' }}
        env:
          SDK_VERSION: 1.4.363.1
          SDK_SHA256: c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a
          MESA_VERSION: 26.3.1
          MESA_SHA256: 64e84cf13d67dd354640bf443ed0445e6a83afd06a5729f0750b3744d633b3f1
        run: |
          $ErrorActionPreference = 'Stop'

          $sdk = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          curl.exe -L --fail --retry 5 -o $sdk "https://sdk.lunarg.com/sdk/download/$env:SDK_VERSION/windows/vulkansdk-windows-X64-$env:SDK_VERSION.exe"
          if ((Get-FileHash $sdk -Algorithm SHA256).Hash -ne $env:SDK_SHA256) { throw 'Vulkan SDK hash mismatch' }
          $install = Start-Process $sdk -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($install.ExitCode)" }

          $mesa = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          curl.exe -L --fail --retry 5 -o $mesa "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          if ((Get-FileHash $mesa -Algorithm SHA256).Hash -ne $env:MESA_SHA256) { throw 'Mesa hash mismatch' }
          7z e $mesa '-oC:\lavapipe' 'x64\vulkan_lvp.dll' 'x64\lvp_icd.x86_64.json' -y
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v 'C:\lavapipe\lvp_icd.x86_64.json' /t REG_DWORD /d 0 /f
          if ($LASTEXITCODE -ne 0) { throw 'registering lavapipe failed' }

          "VULKAN_TEST_FLAGS=--test_env=REI_GPU_VK_REQUIRE_DRIVER=1" >> $env:GITHUB_ENV

      - name: Build
        run: bazel build //rei/...

      - name: Test
        run: bazel test --test_output=all ${{ env.VULKAN_TEST_FLAGS }} //rei/...

      - name: Upload test results
        if: ${{ !cancelled() }}
        # v6+ can't upload to act's local artifact server yet (nektos/act#6114)
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}
          path: |
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
